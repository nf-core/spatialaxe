# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "segger_create_train_predict"
description: |
  Runs segger segment on a Xenium bundle and imports the segmentation
  with xeniumranger import-segmentation.
keywords:
  - segger
  - segmentation
  - xeniumranger import-segmentation
  - coordinate-based segmentation
components:
  - segger/segment
  - xeniumranger/importsegmentation
input:
  - ch_bundle:
      description: |
        Xenium bundle directory.
        Structure: [ val(meta), path("path-to-xenium-bundle") ]
  - expansion_distance:
      description: |
        Nuclear expansion distance passed to xeniumranger import-segmentation.
output:
  - coordinate_space:
      description: |
        The coordinate space in which xeniumranger import-segmentation was run
        Structure: [ val("microns") ]
  - redefined_bundle:
      description: |
        The Xenium bundle redefined with the segger segmentation
        Structure: [ val(meta), ["redefined-xenium-bundle"] ]
authors:
  - "@khersameesh24"
maintainers:
  - "@khersameesh24"
