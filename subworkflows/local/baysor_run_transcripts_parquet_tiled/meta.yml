# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "baysor_run_transcripts_parquet_tiled"
description: to run the `baysor run` command with the transcripts.parquet file as a coordinate-based segmentation run in a tiled manner
keywords:
  - baysor
  - baysor run
  - segmentation
  - xeniumranger import-segmentation
  - coordinate-based segmentation
  - transcript filtering
  - polygons
  - xenium-patch-stitch
components:
  - baysor/preprocess/transcripts
  - baysor/run
  - xeniumranger/import/segmentation
  - xenium/patch/divide
  - xenium/patch/stitch
input:
  - ch_bundle_path:
      description: |
        path to the xenium bundle
        Structure: [ val(meta), path("path-to-xenium-bundle") ]
  - ch_transcripts_parquet:
      description: |
        input parquet file from the xenium bundle
        Structure: [ val(meta), path("path-to-transcripts.parquet") ]
  - ch_config:
      description: |
        config file for the xenium baysor run (stored in assets/config/xenium.toml)
        Structure: [ path("path-to-xenium.toml") ]
  - max_x:
      description: |
        upper x bound for spatial filtering of transcripts.parquet file
        Structure: [ val(int) ]
  - max_y:
      description: |
        upper y bound for spatial filtering of transcripts.parquet file
        Structure: [ val(int) ]
  - min_x:
      description: |
        lower x bound for spatial filtering of transcripts.parquet file
        Structure: [ val(int) ]
  - min_y:
      description: |
        lower y bound for spatial filtering of transcripts.parquet file
        Structure: [ val(int) ]
output:
  - coordinate_space:
      description: |
        the coordinate space in which xeniumranger import-segmentation was run
        Structure: [ val("microns") ]
  - redefined_bundle:
      description: |
        the redefined xenium bundle generated with the segmentation results from baysor
        Structure: [ val(meta), ["redefined-xenium-bundle"] ]
authors:
  - "@khersameesh24"
maintainers:
  - "@khersameesh24"
