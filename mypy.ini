[mypy]
# The QC analysis scripts are vendored verbatim from the upstream
# nf-xenium-processing repo (image_qc.py, snr_metrics.py, transcript_qc_processing.py).
# They are maintained and validated upstream, not type-annotated for mypy here, and are
# re-synced wholesale — so exclude them from type-checking to keep them byte-identical to
# upstream (fixing mypy findings here would fork them and break future re-syncs). All other
# bin/ scripts are still type-checked by `make typecheck`.
exclude = (?x)(
    ^bin/image_qc\.py$
    | ^bin/snr_metrics\.py$
    | ^bin/transcript_qc_processing\.py$
  )
