[mypy]
# The QC analysis scripts are vendored from the upstream nf-xenium-processing
# repo (image_qc.py, snr_metrics.py, transcript_qc_processing.py). They are
# maintained and validated upstream and re-synced wholesale (image_qc.py carries
# one documented adaptation: the xenium_helpers.utils label helpers are inlined
# so the script is self-contained). They are not type-annotated for mypy here, so
# exclude them from type-checking — fixing mypy findings locally would fork them
# and break future re-syncs. All other bin/ scripts are still type-checked by
# `make typecheck`.
exclude = (?x)(
    ^bin/image_qc\.py$
    | ^bin/snr_metrics\.py$
    | ^bin/transcript_qc_processing\.py$
  )
