name: "quarto"
description: Render an HTML report from analysis outputs using a Quarto notebook
keywords:
  - report
  - quarto
  - html
tools:
  - "quarto":
      description: "Quarto is an open-source scientific and technical publishing system that renders documents to HTML and other formats"
      homepage: "https://quarto.org"
      documentation: "https://quarto.org/docs/guide/"
      tool_dev_url: "https://github.com/quarto-dev/quarto-cli"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          (sample id)
    - indir:
        type: directory
        description: Analysis output directory rendered by the Quarto notebook
        pattern: "*"
  - - meta2:
        type: map
        description: |
          Groovy Map containing notebook information
          (notebook id)
    - qmd_file:
        type: file
        description: Quarto notebook to render
        pattern: "*.qmd"
        ontologies: []
  - roi_thresholds_yaml:
      type: file
      description: |
        Optional ROI threshold config YAML passed to the notebook (image QC report only).
        Pass an empty placeholder to skip.
      pattern: "*.{yml,yaml}"
      ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            [sample id]
      - "${html_name}.${format}":
          type: file
          description: Rendered report (HTML by default)
          pattern: "*.{html}"
          ontologies: []
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - quarto:
          type: string
          description: The name of the tool
      - "quarto --version":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@an-altosian"
maintainers:
  - "@an-altosian"
